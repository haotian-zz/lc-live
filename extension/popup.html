<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 12px 14px; width: 300px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex: none; }
  .dot.ok { background: #2da44e; } .dot.bad { background: #d1242f; }
  input { width: 80px; padding: 3px 6px; }
  button { padding: 4px 10px; }
  code { background: #f1f1f1; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .hint { color: #666; font-size: 12px; line-height: 1.4; }
</style></head>
<body>
  <h1>lc-live · Java live compile</h1>
  <div class="row"><span id="dot" class="dot"></span><span id="status">checking…</span></div>
  <div class="row"><label>Server port <input id="port" type="number" min="1" max="65535"></label><button id="save">Save</button></div>
  <div class="hint">Not running? In the repo folder run:<br><code>java server/LcLiveServer.java</code><br>or install the launchd agent so it starts on login.</div>
  <script src="popup.js"></script>
</body></html>
